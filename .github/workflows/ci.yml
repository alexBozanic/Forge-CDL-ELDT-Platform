name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:authoring
      - run: pnpm test:assessment-submission
      - run: pnpm test:assessment-start
      - run: pnpm test:profiles
      - run: pnpm test:lessons
      - run: pnpm test:draft-content
      - run: pnpm test:draft-settings
      - run: pnpm test:student-records
      - run: pnpm test:transcripts
      - run: pnpm test:migration-bundle
      - run: pnpm build
      - name: Test production HTTP security headers
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000/login >/dev/null; then break; fi
            sleep 1
          done
          pnpm test:headers

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/forge_test
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/test-database.sh
      - name: Rehearse backup and restore in disposable PostgreSQL
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" mkdir -p /tmp/forge
          for directory in scripts tests supabase release; do
            docker cp "$directory" "$POSTGRES_CONTAINER:/tmp/forge/$directory"
          done
          docker exec -e PGHOST=/var/run/postgresql -e PGUSER=postgres \
            "$POSTGRES_CONTAINER" bash -c \
            'cd /tmp/forge && ./scripts/rehearse-local-backup-restore.sh'
